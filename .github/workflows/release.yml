name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    env:
      RUST_MIN_STACK: 67108864

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Build and Release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          NO_STRIP: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '0' }}
          RUST_MIN_STACK: 67108864
        with:
          tagName: v__VERSION__
          releaseName: 'Lyra v__VERSION__'
          releaseBody: |
            Lyra v__VERSION__ ya está disponible para Windows, macOS y Linux.

            ### Instaladores por plataforma:
            - **Windows**: `.msi` (instalador Windows) / `.exe`
            - **macOS**: `.dmg` (Universal para procesadores Apple Silicon M-series e Intel)
            - **Linux**: `.AppImage`, `.deb`, `.rpm`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
