[package]
name = "lyra"
version = "2.0.25"
description = "lyra: focused writing"
authors = ["gixi"]
edition = "2021"
license = "unlicense"
repository = "https://github.com/gixi404/lyra"


[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
tauri = { version = "2", features = [
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
tiny_http = "0.12"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "macros"] }
keyring = { version = "3.6", default-features = false, features = ["windows-native", "sync-secret-service"] }
bincode = "1.3"
minisign-verify = "0.3"
tempfile = "3"



[features]
custom-protocol = ["tauri/custom-protocol"]


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
